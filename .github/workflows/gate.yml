# Implements F-07 §3 "from day one" and F-07 §4 merge policy.
# Cloud runner only — no GPU. GPU work is nightly per COMP-14 §5.
name: gate

on:
  push:
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

# The workflow files must sit at the repository root for GitHub to read them.
# The repo holds five cargo workspaces (abyss/, shell/, installer/,
# oracle-eyes/, fog/), so each job sets its own `defaults.run.working-directory`
# and points any filesystem-touching `uses:` action at its workspace explicitly
# (actions ignore `defaults`). All of them build into <repo>/target, set by the
# root .cargo/config.toml.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: ${{ matrix.workspace }} build / fmt / clippy / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [abyss, shell, installer]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      # Smithay/wayland build deps. Trim to what the workspaces actually
      # link; an over-broad list here hides a missing dep in packaging.
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libseat-dev libinput-dev libxkbcommon-dev \
            libudev-dev libgbm-dev libegl-dev libgles2-mesa-dev \
            libdisplay-info-dev libpixman-1-dev libdrm-dev \
            pkg-config

      # Toolchain comes from each workspace's rust-toolchain.toml. CI and dev
      # must not drift, same rule as the Smithay pin in CLAUDE.md.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }} -> ../target

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo build --workspace --all-targets

      - run: cargo test --workspace

  conformance:
    name: wlcs (headless)
    runs-on: ubuntu-24.04
    # PR-only, like tcb-review and spec-trail. The suite is a ~40 minute job
    # dominated by a from-scratch cmake build of wlcs; running it on every
    # push to every branch bought nothing that the PR run does not.
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    defaults:
      run:
        working-directory: abyss
    steps:
      - uses: actions/checkout@v4

      # llvmpipe (mesa-vulkan-drivers pulls the GL software rasteriser) is
      # what makes the headless backend work on a GPU-free runner — ADR 0035.
      # boost + gtest are wlcs's own build deps.
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libegl-dev libgles2-mesa-dev \
            libdisplay-info-dev libpixman-1-dev libdrm-dev libinput-dev \
            libseat-dev libudev-dev libgbm-dev pkg-config cmake g++ \
            libboost-dev libgtest-dev libgmock-dev libwayland-egl-backend-dev \
            wayland-protocols libepoxy-dev mesa-utils libgl1-mesa-dri

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: abyss -> ../target

      # Pinned to the same revision smithay's own wlcs job uses. A floating
      # checkout would let an upstream test change turn this gate red on a
      # commit that did not touch the compositor. The pin is also the cache
      # key: rust-cache covers cargo, not this cmake build.
      - name: wlcs sha
        id: wlcs
        run: echo "sha=12234affdc0a4cc104fbaf8a502efc5f822b973b" >> "$GITHUB_OUTPUT"

      - name: cache wlcs
        id: wlcs-cache
        uses: actions/cache@v4
        with:
          path: target/wlcs-build
          key: wlcs-${{ runner.os }}-${{ steps.wlcs.outputs.sha }}

      - name: build wlcs
        if: steps.wlcs-cache.outputs.cache-hit != 'true'
        env:
          WLCS_SHA: ${{ steps.wlcs.outputs.sha }}
        run: |
          git clone https://github.com/MirServer/wlcs.git ../target/wlcs-src
          git -C ../target/wlcs-src checkout "$WLCS_SHA"
          cmake -S ../target/wlcs-src -B ../target/wlcs-build -DCMAKE_BUILD_TYPE=Release
          cmake --build ../target/wlcs-build -j"$(nproc)"

      - name: build the integration
        run: cargo build -p ec-abyss-wlcs

      # Software GL: no /dev/dri on the runner.
      - name: run the suite
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          RUST_BACKTRACE: "1"
        run: |
          skip=$(grep -vE '^\s*(#|$)' ci/wlcs-skip.txt | paste -sd: -)
          ../target/wlcs-build/wlcs ../target/debug/libec_abyss_wlcs.so \
            --gtest_filter="-${skip}"

  oracle-eyes:
    name: oracle-eyes build / fmt / clippy / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The Oracle-Eyes addon (COMP-18, ADR 0041) is its own cargo workspace.
    # It has no skip-if-missing guard: a move that loses the manifest must
    # fail this job, not pass it silently.
    defaults:
      run:
        working-directory: oracle-eyes
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libtesseract-dev libleptonica-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oracle-eyes -> ../target

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo build --workspace --all-targets

      - run: cargo test --workspace

  fog:
    name: fog build / fmt / clippy / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The Fog file explorer (fog/FOG-SPEC.md, §Implementation guide) is its own
    # cargo workspace. No skip-if-missing guard, as for oracle-eyes.
    defaults:
      run:
        working-directory: fog
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fog -> ../target

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo build --workspace --all-targets

      # FOG-SPEC invariant: the base build compiles without the optional
      # `gio` and `activity` features. --all-features above never proves that.
      - name: cargo build (no default features)
        run: cargo build --workspace --no-default-features

      - run: cargo test --workspace

  supply-chain:
    name: ${{ matrix.workspace }} cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [abyss, shell, installer, oracle-eyes, fog]
    steps:
      - uses: actions/checkout@v4
      # Advisories + license + source checks. This is a down payment on
      # S-12; when S-12 lands it supersedes the deny.toml written here.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          manifest-path: ${{ matrix.workspace }}/Cargo.toml

  tcb-review:
    name: TCB touch check
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # F-07 §4: the owner reads every line in the enforcement path.
      # This does not enforce review — it makes the obligation visible on
      # the PR so it cannot be forgotten six months from now.
      - name: flag TCB paths
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          tcb=$(echo "$changed" | grep -E \
            '^(abyss/crates/ec-(policyd|policy-eval|sandbox|brokerd)/|installer/crates/ec-setup-helper/|packaging/polkit/|abyss/crates/ec-abyss/src/(policy|trusted_ui|audit)/|abyss/crates/ec-abyss/src/render/capture\.rs$|AbyssCompositor/(crates/(policyd|ec-policy-eval|sandbox|brokerd|ec-setup-helper)/|dist/polkit/|crates/abyss/src/(policy|trusted_ui|audit)/|crates/abyss/src/render/capture\.rs$))' \
            || true)
          if [ -n "$tcb" ]; then
            echo "::warning title=TCB path touched::Line-by-line owner review required (F-07 §4)"
            echo "$tcb" | sed 's/^/  /'
            echo "TCB_TOUCHED=1" >> "$GITHUB_ENV"
          else
            echo "no TCB paths touched"
          fi

  gui-coverage:
    name: GUI coverage ratchet
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # F-01 §4 (Appendix B): every setting reachable without a text editor.
      # shell/ci/gui-coverage-exceptions.txt lists the ones that are not yet,
      # and only ever shrinks. Both halves matter: the count check stops the
      # list growing, and the inclusion check stops a swap that keeps the count
      # the same while smuggling a new exception in.
      - name: exception list only shrinks
        run: |
          new=shell/ci/gui-coverage-exceptions.txt
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          filter() { grep -vE '^\s*(#|$)' | sort -u; }
          # The list moved from AbyssCompositor/ci/ when the repo was split into
          # per-product directories; a base from before that move keeps the
          # ratchet by reading the old path.
          basefile=""
          for p in "$new" AbyssCompositor/ci/gui-coverage-exceptions.txt; do
            if git cat-file -e "$base:$p" 2>/dev/null; then basefile="$p"; break; fi
          done
          # A base with no list at all is the bootstrap case: the PR that
          # introduces the ratchet sets the first notch, and every later PR is
          # measured against it. That is not the same as a base whose list is
          # present but empty, where growth is a real violation.
          if [ -z "$basefile" ]; then
            echo "no exception list at the merge base; this PR sets the first notch:"
            filter < "$new" | sed 's/^/  + /'
            exit 0
          fi
          git show "$base:$basefile" | filter > /tmp/base.txt
          filter < "$new" > /tmp/head.txt
          echo "base: $(wc -l < /tmp/base.txt)  head: $(wc -l < /tmp/head.txt)"
          if [ "$(wc -l < /tmp/head.txt)" -gt "$(wc -l < /tmp/base.txt)" ]; then
            echo "::error::the GUI-coverage exception list grew; it is a ratchet"
            comm -13 /tmp/base.txt /tmp/head.txt | sed 's/^/  + /'
            exit 1
          fi
          added=$(comm -13 /tmp/base.txt /tmp/head.txt)
          if [ -n "$added" ]; then
            echo "::error::new entries on the GUI-coverage exception list"
            echo "$added" | sed 's/^/  + /'
            exit 1
          fi
          echo "ratchet holds"

  doc-refs:
    name: doc references resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # F-07 §7: docs/ is the source of truth, so a path it cites must exist.
      - name: check doc paths
        run: abyss/ci/doc-refs.sh

  spec-trail:
    name: PR cites a spec section
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      # F-07 §5: every PR body cites the spec section it implements.
      # This is what makes the spec->code trail auditable when work is
      # delegated to an agent rather than typed by hand.
      # Fog's spec has no numbered IDs, so it is cited as 'Implements FOG §X'.
      - name: check PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$BODY" | grep -qE '(Implements|Fixes|Amends) ((COMP|S|P|A|F|I|D|X)-[0-9]{2}|FOG §)'; then
            echo "spec citation found"
          else
            echo "::error title=No spec citation::PR body must cite the spec section it implements, e.g. 'Implements COMP-08 §4' or 'Implements FOG §Milestones' (F-07 §5)"
            exit 1
          fi
