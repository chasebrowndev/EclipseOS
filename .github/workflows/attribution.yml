# Enforces the attribution rule in CLAUDE.md ("Commits & PRs"): no commit
# message carries an agent co-author trailer or session link. Anyone may author
# a pull request's commits (contributors sign the CLA, CONTRIBUTING.md); only
# the owner merges, which is a branch rule plus CODEOWNERS, not this check.
#
# This is the server-side half of the rule. The local `commit-msg` hook is the
# fast half; a hook can be bypassed with --no-verify, this cannot.
name: attribution

on:
  push:
  pull_request:

jobs:
  attribution:
    name: no agent attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check commits
        run: |
          set -euo pipefail

          # The commits this event actually introduces. On a pull_request the
          # merge base is authoritative; on a push, `before` is a zero sha for
          # a newly created branch, in which case only the tip is checkable
          # without guessing at a base.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            range="$base..$head"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="$before..${{ github.sha }}"
            else
              range="${{ github.sha }}~1..${{ github.sha }}"
              git cat-file -e "${{ github.sha }}~1^{commit}" 2>/dev/null || range="${{ github.sha }}"
            fi
          fi

          commits=$(git rev-list "$range" 2>/dev/null || git rev-list -1 "${{ github.sha }}")
          if [ -z "$commits" ]; then
            echo "no new commits to check"
            exit 0
          fi

          fail=0
          for sha in $commits; do
            short=$(git log -1 --format=%h "$sha")

            # A forbidden trailer or footer. Anchored to the start of a
            # line: real trailers always are, and an unanchored pattern
            # would reject a commit message that merely names the rule --
            # including the one that introduced this check.
            hits=$(git log -1 --format='%B' "$sha" | grep -inE \
              '^[[:space:]]*(co-authored-by:.*(claude|anthropic)|claude-session:|(.{0,4})?generated with \[?claude code)' || true)
            if [ -n "$hits" ]; then
              echo "::error title=Agent attribution in commit message::$short"
              echo "$hits" | sed 's/^/    /'
              fail=1
            fi

          done

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Commit messages must not carry agent attribution (Co-Authored-By an agent, a session link, or a generated-with line)."
            echo "See the 'Commits & PRs' section of CLAUDE.md."
            exit 1
          fi
          echo "checked $(echo "$commits" | wc -l) commit(s): clean"
