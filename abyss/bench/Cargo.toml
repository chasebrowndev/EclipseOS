[package]
name = "ec-abyss-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The harness is a binary, not a `cargo bench` target. COMP-14 §2 states every
# budget as a p99; `cargo bench`/criterion report a mean with a confidence
# interval and discard tail outliers by design, which is the one statistic the
# spec never asks for. See decisions/0043-hand-rolled-bench-harness.md.
[lib]
name = "ec_abyss_bench"
path = "src/lib.rs"

[[bin]]
name = "ec-abyss-bench"
path = "src/main.rs"

# Dev-only: `shader-preview` renders an add-on transition style offscreen
# through the real render path (surfaceless EGL, no display). Not shipped.
[[bin]]
name = "shader-preview"
path = "src/bin/shader-preview.rs"

[dependencies]
smithay = { workspace = true, features = ["wayland_frontend", "desktop", "renderer_gl", "xwayland"] }
ec-abyss-config = { path = "../crates/ec-abyss-config" }
ec-abyss-render = { path = "../crates/ec-abyss-render" }
