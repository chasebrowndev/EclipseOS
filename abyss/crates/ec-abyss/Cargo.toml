[package]
name = "ec-abyss"
description = "EclipseOS Wayland compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published; also what lets cargo-deny's `allow-wildcard-paths` cover the
# path dependencies.
publish = false

# lib + bin: the conformance harness (COMP-15 §1) links the compositor and
# drives it in-process, which a bin-only crate cannot support.
[lib]
name = "ec_abyss"
path = "src/lib.rs"

[[bin]]
name = "ec-abyss"
path = "src/main.rs"

[dependencies]
smithay = { workspace = true, features = [
  "wayland_frontend",
  "desktop",
  "renderer_gl",
  "xwayland",
] }
ec-abyss-config = { path = "../ec-abyss-config" }
ec-abyss-wire = { path = "../ec-abyss-wire" }
ec-abyss-render = { path = "../ec-abyss-render" }
calloop.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-journald.workspace = true
anyhow.workspace = true
xkbcommon.workspace = true
libc = "0.2"
rustix.workspace = true
kdl.workspace = true
regex.workspace = true
serde_json.workspace = true
blake3.workspace = true
# Grant verification and scope evaluation, shared with policyd (ADR 0008).
ec-policy-eval = { path = "../ec-policy-eval" }
# The brokerd wire format, for the compositor's own unlock prompt (S-08 §2).
ec-brokerd = { path = "../ec-brokerd" }
zeroize = "1"
# eclipse_agent_v1 server bindings (COMP-08).
ec-protocols = { path = "../ec-protocols", features = ["server"] }

[dev-dependencies]
ec-abyss-config = { path = "../ec-abyss-config", features = ["test-hooks"] }
# An in-process client for the state tests: the lock-screen focus rules can
# only be exercised against real surfaces (COMP-06 §1, COMP-04 §7).
wayland-client = "0.31"
# The agent socket tests drive eclipse_agent_v1 from the client side.
ec-protocols = { path = "../ec-protocols", features = ["client", "server"] }
# The reference client for eclipse_semantic_v1 publishes through the real
# publisher (COMP-16 M22).
ec-cataclysm-pub = { path = "../ec-cataclysm-pub" }
# Signs test grants for the policy/ tests; abyss itself only verifies.
ed25519-dalek = "3.0.0"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[features]
default = ["winit", "drm", "headless"]
# COMP-19 §3: a protected surface refuses `injected` input, which is what the
# wlcs conformance suite drives everything through. With this feature the
# refusal is compiled out so the suite can run against a protected window.
# Never in a release build: `Origin::reaches_protected` has no `Injected` arm
# without it, and a test asserts that.
wlcs = []
# `winit.rs` binds wl_drm and imports dmabuf, both of which need the system
# EGL library, and `EGLDevice::try_get_render_node` is gated on `backend_drm`;
# the feature has to name all three rather than relying on `drm` being on too.
winit = [
  "smithay/backend_winit",
  "smithay/backend_egl",
  "smithay/backend_drm",
  "smithay/use_system_lib",
]
# CI backend: EGL device (hardware render node or Mesa software), no KMS, no
# host display server. COMP-01 §10.
headless = ["smithay/backend_egl", "smithay/backend_drm", "smithay/use_system_lib"]
# Production backend: KMS via libseat + udev + libinput, GLES on GBM/EGL.
drm = [
  "smithay/backend_drm",
  "smithay/backend_gbm",
  "smithay/backend_egl",
  "smithay/backend_libinput",
  "smithay/backend_session",
  "smithay/backend_session_libseat",
  "smithay/backend_udev",
  "smithay/use_system_lib",
]
