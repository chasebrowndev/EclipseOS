[package]
name = "ec-ctl"
description = "CLI for the abyss human control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published; `publish = false` also keeps `cargo deny` from flagging
# the path dependency on ec-ipc (as in ec-audit).
publish = false

[[bin]]
name = "ec-ctl"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
libc = "0.2"
kdl.workspace = true
# The progress feed wire contract (`ec-ctl progress`). ec-ipc is serde_json + libc.
ec-ipc = { path = "../ec-ipc" }

[dev-dependencies]
# Only so `tests/schema_drift.rs` can compare this crate's copy of the
# policy-owned key list against the schema it mirrors. Not linked into the
# shipped binary.
ec-abyss-config = { path = "../ec-abyss-config" }
