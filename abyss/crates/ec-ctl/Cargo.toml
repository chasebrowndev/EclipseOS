[package]
name = "ec-ctl"
description = "CLI for the abyss human control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published; `publish = false` also keeps `cargo deny` from flagging
# the path dependency on ec-ipc (as in ec-audit).
publish = false

[[bin]]
name = "ec-ctl"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
libc = "0.2"
kdl.workspace = true
# The progress feed wire contract (`ec-ctl progress`). ec-ipc is serde_json + libc.
ec-ipc = { path = "../ec-ipc" }
# Key ownership (`schema::get_key(..).owner`) for the policy/main file split,
# and the schema drift test. State-free: no smithay, no calloop.
ec-abyss-config = { path = "../ec-abyss-config" }
