[package]
name = "ec-agentd"
description = "EclipseOS agent daemon (A-01, A-08): console backend, task host, MCP server, policyd link; M11 admission client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published; `publish = false` also keeps `cargo deny` from flagging
# the path dependencies (as in policyd).
publish = false

[lib]
name = "ec_agentd"
path = "src/lib.rs"

[[bin]]
name = "ec-agentd"
path = "src/main.rs"

[dependencies]
ec-protocols = { path = "../ec-protocols", features = ["client"] }
wayland-client = "0.31"
ec-policy-eval = { path = "../ec-policy-eval" }
ec-ipc = { path = "../ec-ipc" }
serde_json.workspace = true
kdl.workspace = true
blake3.workspace = true
libc = "0.2"
rustix = { workspace = true, features = ["net", "process", "fs"] }

[features]
# Runs an agent's entrypoint as a plain child, no bwrap and no scope, for
# headless tests. Never enabled by the package build (PKGBUILD).
dev-unsandboxed = []
