# SPDX-License-Identifier: AGPL-3.0-only
# Apotheosis fuzz workspace (T-18 §11, T-25 §4, ADR 0110). Not shipped, not a member of
# the apotheosis workspace (its own `[workspace]` below), skipped by `ci/lang-rule.sh`:
# libfuzzer-sys compiles libFuzzer's C++ runtime in its build script, the one place the
# T-00 §3.1 language rule is waived. `rust-toolchain.toml` here pins a dated nightly for
# `-Zsanitizer`.
#
# Targets are thin wrappers over stable bodies in the shipping crates. Seed corpora are
# `corpus/<target>/`; `apoth-testkit/tests/fuzz_corpus.rs` replays every one of them on
# the stable toolchain in the normal `cargo test --workspace` run, and checks that every
# target here has a `[[bin]]`, a corpus and a replay.
#
# CI smoke (T-25 §8), from this directory with cargo-fuzz installed: `./smoke.sh` runs
# each target for 60 s (`cargo fuzz run <t> corpus/<t> -- -max_total_time=60`). Without
# cargo-fuzz, `cargo build` here still compiles and links every target (no sanitizer
# instrumentation), and each binary replays given corpus files: `target/debug/<t> corpus/<t>/*`.

[package]
name = "apoth-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
apoth-vt = { path = "../crates/apoth-vt" }
apoth-term = { path = "../crates/apoth-term" }
apoth-proto = { path = "../crates/apoth-proto" }
apoth-config = { path = "../crates/apoth-config" }
apoth-media = { path = "../crates/apoth-media" }
apoth-grid = { path = "../crates/apoth-grid" }
apoth-input = { path = "../crates/apoth-input", default-features = false }
apoth-unicode = { path = "../crates/apoth-unicode" }
apoth-terminfo = { path = "../crates/apoth-terminfo" }

[profile.release]
debug = 1

[[bin]]
name = "av1_obu"
path = "fuzz_targets/av1_obu.rs"
