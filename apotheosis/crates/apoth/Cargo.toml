[package]
name = "apoth"
description = "Apotheosis command-line client: control socket, config, icat, play."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish = false

[dependencies]
apoth-action.workspace = true
apoth-config.workspace = true
apoth-image.workspace = true
apoth-proto.workspace = true
apoth-pty.workspace = true
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
rustix = { version = "1", features = ["std", "event", "net", "process", "termios"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
