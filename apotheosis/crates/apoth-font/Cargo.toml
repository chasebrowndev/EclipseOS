[package]
name = "apoth-font"
description = "Font discovery, shaping, rasterisation, atlas packing and built-in glyphs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish = false

[dependencies]
fontconfig-parser = "0.5.8"
skrifa = "0.44.0"
harfrust = "0.12.0"
swash = { version = "0.2.10", default-features = false, features = ["std", "scale", "render"] }
zeno = { version = "0.3.3", default-features = false, features = ["std", "eval"] }

[lints]
workspace = true
