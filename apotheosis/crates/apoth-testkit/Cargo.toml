[package]
name = "apoth-testkit"
description = "Test infrastructure: golden-grid fixtures, oracles, headless driver, benches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish = false

[dependencies]
apoth-term = { workspace = true }
apoth-grid = { workspace = true }
apoth-vt = { workspace = true }
# Peers for the T-23 §2 relative targets (`perf::peers`) and the differential oracles
# (T-25 section 2). Apache-2.0, pure Rust. They are run, never read (T-00 §3.4). This crate
# is test infrastructure and ships in no package. default-features = false drops serde.
vte = "0.15"
alacritty_terminal = { version = "0.26", default-features = false }

[lints]
workspace = true
