[workspace]
resolver = "2"
members = [
  "crates/fog-proto",
  "crates/fog-config",
  "crates/fog-daemon",
  "crates/fog-widgets",
  "crates/fog-ui",
  "crates/fog-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/chasebrowndev/eclipseos"

[workspace.dependencies]
fog-proto = { path = "crates/fog-proto" }
fog-config = { path = "crates/fog-config" }
fog-daemon = { path = "crates/fog-daemon" }
fog-widgets = { path = "crates/fog-widgets" }
# eclipse-ui's pin, but with the tokio executor: the UI's fogd connection is a
# tokio UnixStream.
iced = { version = "0.14", default-features = false, features = [
  "wgpu",
  "advanced",
  "wayland",
  "tokio",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "macros",
  "time",
] }
rustix = { version = "1", features = ["fs", "net", "process"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
# The compositor's pin (AbyssCompositor/Cargo.toml): KDL v2 syntax.
kdl = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# Local time for the modified column; the zone is read once, before iced
# starts (the UI thread never does filesystem I/O).
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-zoneinfo",
] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
