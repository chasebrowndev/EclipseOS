# The live medium's session user (D-07 §2.1). D-01 §5: no supplementary groups,
# no password, no sudoers or wheel entry. A logind session on the seat is all
# the installer needs; the root helper is reached through polkit, not sudo.
u liveuser 1000 "EclipseOS live user" /home/liveuser /usr/bin/bash
