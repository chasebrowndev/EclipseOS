# EclipseOS package repository (D-02 reduced).
#
# Shipped by eclipseos-meta into /etc/pacman.d/eclipseos.conf and included from
# /etc/pacman.conf. Reachable over the tailnet only; a machine that is not on
# the tailnet simply fails to sync this repo and still updates from Arch.
[eclipseos]
SigLevel = Required DatabaseRequired
Server = http://chase-pc:8088/x86_64
