#
# Install to: /usr/lib/systemd/system/greetd.service.d/10-eclipseos.conf
#
# /etc/greetd/config.toml is owned by the greetd package, so eclipseos-meta
# cannot ship one there without a pacman file conflict. Point greetd at the
# EclipseOS config instead; upstream's file stays on disk and stays inert.
[Service]
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/eclipse/greetd/config.toml
