#
# Install to: /usr/lib/systemd/system.conf.d/10-eclipseos.conf
#
# systemd arms the hardware watchdog for the reboot, and the kernel logs
# "watchdog did not stop!" at crit — which `quiet loglevel=3` still prints —
# over the shutdown screen. EclipseOS boots silent and shuts down silent.
[Manager]
RebootWatchdogSec=off
