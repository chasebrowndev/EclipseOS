[workspace]
resolver = "2"
members = ["crates/abyss", "crates/eclipse-ctl", "crates/eclipse-ipc", "crates/wlcs-abyss"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/chasebrowndev/eclipseos"

[workspace.dependencies]
smithay = { version = "=0.7.0", default-features = false }
calloop = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
anyhow = "1"
thiserror = "2"
xkbcommon = "0.8"
kdl = "6"
# Window-rule matchers (COMP-05 §4). Titles are client-controlled, so the
# matcher engine must be linear-time; `regex` guarantees no backtracking.
regex = { version = "1", default-features = false, features = [
  "std",
  "perf",
  "unicode-case",
] }
serde_json = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
