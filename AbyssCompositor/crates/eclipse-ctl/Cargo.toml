[package]
name = "eclipse-ctl"
description = "CLI for the abyss human control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "eclipse-ctl"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
libc = "0.2"
kdl.workspace = true

[dev-dependencies]
# Only so `tests/schema_drift.rs` can compare this crate's copy of the
# policy-owned key list against the schema it mirrors. Not linked into the
# shipped binary.
abyss = { path = "../abyss" }
