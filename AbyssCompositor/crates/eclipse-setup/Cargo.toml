[package]
name = "eclipse-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "the graphical installer and setup wizard (D-07). Steps 1-14; step 0 is eclipse-welcome."
publish = false

[lib]
name = "eclipse_setup"
path = "src/lib.rs"

[[bin]]
name = "eclipse-setup"
path = "src/main.rs"

[dependencies]
# Pinned to match eclipse-ui exactly (ADR 0039). `wayland` and `thread-pool` are
# load-bearing as in every other DE crate; a plain xdg_toplevel, no layer shell.
iced = { version = "0.14", default-features = false, features = ["wgpu", "advanced", "wayland", "thread-pool", "canvas", "image"] }
# `--shot` builds a `UserInterface` by hand to render a step offscreen; iced
# does not re-export it. Same version iced itself resolves.
iced_runtime = "0.14"
eclipse-ui = { path = "../eclipse-ui" }
# The COMP-13 §1.4 write API: `input.kb-*` live, `setup.*`. Nothing else.
eclipse-ipc = { path = "../eclipse-ipc" }
# Step 0, embedded (its `Message::Begin` is the hand-off).
eclipse-welcome = { path = "../eclipse-welcome" }
eclipse-setup-plan = { path = "../eclipse-setup-plan" }
serde_json.workspace = true
# The password lives in `Zeroizing` buffers and is overwritten on drop.
zeroize = "1"
# Only for `--shot`: encoding the offscreen frame.
image = { version = "0.25", default-features = false, features = ["png"] }
