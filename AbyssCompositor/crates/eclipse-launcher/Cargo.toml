[package]
name = "eclipse-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Eclipse application launcher: type, pick, run."
# Its own crate and its own package so it installs without the taskbar
# (ADR 0052): a Quickshell user can run this and nothing else of ours.
publish = false

[lib]
name = "eclipse_launcher"
path = "src/lib.rs"

[[bin]]
name = "eclipse-launcher"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "advanced", "wayland", "thread-pool"] }
iced_layershell = "0.19.1"
eclipse-ui = { path = "../eclipse-ui" }
eclipse-services = { path = "../eclipse-services" }
eclipse-ipc = { path = "../eclipse-ipc" }
serde_json.workspace = true
