[package]
name = "ec-secret-prompt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Asks for one secret (a wifi passphrase, a Bluetooth PIN, an API key), hands it to the service, and exits."
# Its own process so the secret never passes through the taskbar (ADR 0053),
# and its own crate so anyone replacing the taskbar can reuse it (ADR 0052).
publish = false

[lib]
name = "ec_secret_prompt"
path = "src/lib.rs"

[[bin]]
name = "ec-secret-prompt"
path = "src/main.rs"

[dependencies]
# Pinned to match ec-ui exactly (ADR 0039). A plain xdg_toplevel, so no
# iced_layershell: windowrules, and with them the `secret` sensitivity class,
# only match toplevels.
iced = { version = "0.14", default-features = false, features = ["wgpu", "advanced", "wayland", "thread-pool"] }
ec-ui = { path = "../ec-ui" }
# The join (wifi) and the NetworkManager round trip behind it.
ec-services = { path = "../ec-services" }
# The pairing door on the session bus. Same version ec-services pins.
zbus = "5.19"
# The Terminal target's request on stdin (ADR 0053 amendment, T-22 §3). Same versions
# the workspace already locks.
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
# pidfd on the parent for the Terminal target's "verified" check.
rustix = { version = "1", features = ["std", "process", "event"] }
