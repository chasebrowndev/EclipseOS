# Live medium: NetworkManager owns networking (D-07 §4 step 3) so the installer's
# network step and the installed system speak the same thing. iwd stays as the
# wifi backend so `iwctl` on tty2 and the fallback script's saved-network
# carry-over (/var/lib/iwd) keep working.
[device]
wifi.backend=iwd
