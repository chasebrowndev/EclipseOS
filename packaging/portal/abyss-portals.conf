# xdg-desktop-portal backend choice for XDG_CURRENT_DESKTOP=Abyss.
# Settings (ADR 0084) and FileChooser (Fog's picker, ADR 0100) come from
# ec-portal; every other interface keeps whatever backend the portal picks on
# its own.
[preferred]
default=*
org.freedesktop.impl.portal.Settings=abyss
org.freedesktop.impl.portal.FileChooser=abyss
