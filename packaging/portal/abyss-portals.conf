# xdg-desktop-portal backend choice for XDG_CURRENT_DESKTOP=Abyss.
# Settings (ADR 0084) and FileChooser (Fog's picker, ADR 0100) come from
# ec-portal; ScreenCast and Screenshot from ecl-desktop-portal (eclipseos-portal,
# D-08), which asks abyss for a compositor-drawn confirm per share (ADR 0097).
# Every other interface keeps whatever backend the portal picks on its own.
[preferred]
default=*
org.freedesktop.impl.portal.Settings=abyss
org.freedesktop.impl.portal.FileChooser=abyss
org.freedesktop.impl.portal.ScreenCast=eclipse
org.freedesktop.impl.portal.Screenshot=eclipse
