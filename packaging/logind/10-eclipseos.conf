#
# Install to: /usr/lib/systemd/logind.conf.d/10-eclipseos.conf
#
# A short press of the power key is the compositor's: abyss binds XF86PowerOff
# to the session menu (ec-center). logind must not also power off on it. A long
# press stays the hard off.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
