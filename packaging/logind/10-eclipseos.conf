#
# Install to: /usr/lib/systemd/logind.conf.d/10-eclipseos.conf
#
# A short press of the power key is the compositor's: abyss binds XF86PowerOff
# to the session menu (ec-center). logind must not also power off on it. A long
# press stays the hard off.
#
# The lid is the compositor's too (output `lid-close`, COMP-01 §4.1): abyss
# turns the panel off and moves its windows when another screen is on, and
# suspends through logind when none is. logind deciding on its own sees "no
# external display" during the greeter-to-session handoff, when no compositor
# is running, and suspends a docked laptop at login.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
