# The machine's login screen choices (ADR 0089, D-01 §4.1). Root writes through
# ec-greeter-apply; the greeter user reads.
d /var/lib/eclipse 0755 root root -
d /var/lib/eclipse/greeter 0755 root root -
# The compositor draws this behind the glass greeter. A fresh machine starts with
# the shipped image; ec-greeter-apply keeps it current after that.
C /var/lib/eclipse/greeter/wallpaper.png 0644 root root - /usr/share/backgrounds/eclipseos/greeter.png
# The greeter's home is /, so Mesa has nowhere to keep compiled shaders and the
# glass shaders were rebuilt every boot. ec-abyss-launch points XDG_CACHE_HOME here.
d /var/cache/eclipse-greeter 0700 greeter greeter -
