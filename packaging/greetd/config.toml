#
# EclipseOS — greetd configuration.
# Install to: /etc/eclipse/greetd/config.toml  (root:root 0644)
#
# greetd reads /etc/greetd/config.toml by default and that file belongs to the
# greetd package, so EclipseOS cannot own it. A systemd drop-in
# (10-eclipseos.conf) points greetd at this file instead; regreet is pointed at
# its siblings the same way. D-01 §6: /etc/eclipse is the configuration.
#
# The greeter runs regreet on Abyss in kiosk mode (ADR 0086): no binds but the
# reserved override chords, no add-on hooks, no Xwayland, and the compositor
# exits when regreet does, which is what lets greetd start the session.
# /usr/bin/ec-abyss is absolute because the `greeter` user cannot follow a dev
# install's /usr/local/bin symlink into /home.
# The default session command and the `greeter` user are load-bearing and must
# not change: greetd drops to `greeter` before exec, and that user cannot read
# /home, so every asset the greeter shows lives under /usr/share or /etc.

[terminal]
vt = 1

[default_session]
# systemd-cat: the greeter's stdio is the VT, and its output would show as text
# around the handoff to the session.
command = "systemd-cat -t greeter /usr/bin/ec-abyss --backend drm --kiosk -- regreet --config /etc/eclipse/greetd/regreet.toml --style /etc/eclipse/greetd/regreet.css"
user = "greeter"
