# EclipseOS package repository (D-02).
#
# Shipped by eclipseos-meta into /etc/pacman.d/eclipseos.conf and included from
# /etc/pacman.conf. Served as the assets of the rolling `repo-x86_64` GitHub
# release (packaging/repo/publish-github.sh). The transport is public; the
# packaging key's signatures on the database and every package are the trust.
[eclipseos]
SigLevel = Required DatabaseRequired
Server = https://github.com/chasebrowndev/EclipseOS/releases/download/repo-x86_64
