# EclipseOS default foot config. Copy to ~/.config/foot/foot.ini to override
# (foot reads the first file it finds, so that replaces this one whole).
#
# The theme file below is written by ec-portal and follows Settings > Appearance:
# it sets initial-color-theme for new windows, and ec-portal signals running
# foot processes (SIGUSR1/SIGUSR2) when the scheme flips. A missing file is fine.
[main]
include=~/.config/eclipse/foot-theme.ini
resize-by-cells=no
pad=10x0

# blur=yes is what lets abyss blur the window instead of painting a gold ring.
[colors-dark]
background=0d0d0d
foreground=e8e6e1
alpha=0.72
blur=yes
selection-foreground=0d0d0d
selection-background=d8af48

[colors-light]
background=f6f4ef
foreground=1d1b17
alpha=0.72
blur=yes
selection-foreground=1d1b17
selection-background=d8af48
regular0=1d1b17
regular1=b3261e
regular2=2e7d32
regular3=8a6a00
regular4=1f4fa3
regular5=8e3a8e
regular6=0f7a7a
regular7=5b574f
bright0=4a463f
bright1=d03a30
bright2=3d9142
bright3=a07d00
bright4=2d62c0
bright5=a64da6
bright6=1b9494
bright7=2b2822
